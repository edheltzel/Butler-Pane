name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LUAU_VERSION: '0.741'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau
        run: |
          curl -fsSL -o /tmp/luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          mkdir -p "$HOME/.luau/bin" && unzip -q /tmp/luau.zip -d "$HOME/.luau/bin"
          chmod +x "$HOME/.luau/bin/"*
          echo "$HOME/.luau/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          cd plugin && rc=0; out=$(luau-analyze $(ls *.luau | grep -v '^tern\.d\.luau$') 2>&1) || rc=$?; [ $rc -le 1 ] && ! printf '%s\n' "$out" | grep SyntaxError

      - name: Test
        run: |
          cd plugin && luau check.luau | grep -qx 'parse: ok'
